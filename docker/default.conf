# The image's own site: the app at the origin root on port 80, every path that is not a file
# answered with index.html. The MindRoom Helm chart (cluster/k8s/client) replaces this file.
#
# Files under /assets/ carry a content hash in their names, so browsers may keep them; a missing one
# is a 404, never the app shell, so a page from an older build notices that it is out of date. Every
# other response is revalidated, so a new image, config.json or notices list shows on the next load.
#
# A location with add_header of its own drops the inherited headers, so each one includes the
# framing headers again (docker-entrypoint.d/40-frame-headers.sh writes the file).
server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mindroom-frame-headers.inc;
  add_header Cache-Control "no-cache" always;

  # The speech model's runtime, about 15 MB of WebAssembly, goes compressed (to about 4.5 MB).
  gzip on;
  gzip_types application/wasm;

  location / {
    try_files $uri /index.html;
  }

  # Files under /public/ (language catalogs, license texts) are only ever files: a missing one is a
  # 404, never the app shell.
  location /public/ {
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/mindroom-frame-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # An operator replaces the list by mounting a directory over /opt/mindroom/notices.
  location = /notices.json {
    alias /opt/mindroom/notices/notices.json;
  }

  location = /.well-known/apple-app-site-association {
    default_type application/json;
  }
}
