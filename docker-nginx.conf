server {
  listen 80;
  listen [::]:80;

  # Authentication policy belongs to the reverse proxy in front of this image.
  location ~ ^/(?:[^/]+/)?authentication-recovery-probe$ {
    add_header Cache-Control "no-store" always;
    return 204;
  }

  location ~ ^/(?:[^/]+/)?(authentication-recovery\.js|runtime-config\.js)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    rewrite ^/(?:[^/]+/)?(authentication-recovery\.js|runtime-config\.js)$ /$1 break;
  }

  location / {
    root /usr/share/nginx/html;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;
    rewrite ^/runtime-config.js$ /runtime-config.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;
  }

  location ~ ^/[^/]+/(assets|public)/ {
    root /usr/share/nginx/html;
    rewrite ^/[^/]+/(.*)$ /$1 break;
  }

  location ~ ^/[^/]+/(sw.js|config.json|manifest.json|pdf.worker.min.js|runtime-config.js)$ {
    root /usr/share/nginx/html;
    rewrite ^/[^/]+/(.*)$ /$1 break;
  }

  location ~ ^/(?!assets/|public/)[^/]+/ {
    root /usr/share/nginx/html;
    rewrite ^/[^/]+/.*$ /index.html break;
  }
}
