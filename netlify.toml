# Netlify serves the production build (`npm run build`) as a single-page app.
[build]
  command = "npm run build"
  publish = "dist"

# The bootstrap files are served as they are: the single-page fallback below must never answer
# them with index.html. Netlify applies the first redirect that matches.
[[redirects]]
  from = "/authentication-recovery.js"
  to = "/authentication-recovery.js"
  status = 200
  force = true

[[redirects]]
  from = "/runtime-config.js"
  to = "/runtime-config.js"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/.well-known/apple-app-site-association"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Who may frame the app, as scripts/frame-headers.mjs sends it from `vite preview`: pages of this
# origin only (the app frames its own PDF page), and no frame at all for the pairing page.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/connect"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/connect/"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"

# A deployment changes these without a rebuild, so no cache may keep them.
[[headers]]
  for = "/authentication-recovery.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
