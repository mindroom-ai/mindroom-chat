<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- Frames may show only this app's own pages and reCAPTCHA (registration). Agent canvases
         are srcdoc frames, which inherit this policy and add their own. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/"
    />
    <!-- A second policy, enforced beside the first: no plugin content, and no <base> element that
         would move the app's relative URLs (canvases inherit it too, and set base-uri 'none').
         script-src stays open: canvases run agent scripts inline in srcdoc frames, which inherit
         this policy. Who may frame the app is a header (scripts/frame-headers.mjs). -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Chromium and Firefox resize the page for the on-screen keyboard with interactive-widget.
         WebKit (every iOS browser, and Safari) does not know the key and logs it as a console
         error on each load, so it gets the key only outside WebKit; iOS keyboard handling is
         useMobileKeyboardViewportFix's. WebKit gets maximum-scale=1 instead: iOS magnifies the
         page when a field with text under 16 px is focused (fields have 16 px text at the default
         page zoom, so below it), and the app's pinch changes the page zoom setting rather than
         magnifying (theme/usePinchToZoom.ts), so nothing could zoom it back out (the iOS app's
         web view switches its own pinch off as that zoom begins). -->
    <script>
      document.querySelector('meta[name="viewport"]').content +=
        !/AppleWebKit/.test(navigator.userAgent) || /Chrome\//.test(navigator.userAgent)
          ? ', interactive-widget=resizes-content'
          : ', maximum-scale=1';
    </script>
    <title>MindRoom</title>
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="128x128" href="/res/branding/mindroom-favicon.png" />
    <link rel="apple-touch-icon" href="/res/icons/apple-touch-icon.png" />
    <script src="/runtime-config.js"></script>
    <!-- Also loaded on its own, so a deployment's custom runtime-config.js cannot drop it. -->
    <script src="/authentication-recovery.js"></script>
  </head>
  <body>
    <noscript>MindRoom needs JavaScript enabled.</noscript>
    <div id="portalContainer"></div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
