<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindRoom Client: design directions</title>
<style>
  * { box-sizing: border-box; }
  .page { display: flex; flex-direction: column; gap: 28px; padding: 4px 0 8px; }
  .label { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px 2px; font: 600 15px/1.3 var(--font-sans, system-ui); }
  .label small { font-weight: 400; color: var(--muted-foreground, #888); font-size: 13px; }
  .stage { width: 100%; }
  .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: calc(var(--radius, 10px) + 4px); background: var(--secondary, #eee); border: 1px solid var(--border, #ddd); width: fit-content; }
  .tabs button { font: 600 13px var(--font-sans, system-ui); padding: 7px 14px; border-radius: var(--radius, 10px); border: 0; background: transparent; color: var(--muted-foreground, #777); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--background, #fff); color: var(--foreground, #111); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .crop { width: 100%; height: 440px; overflow: hidden; border-radius: 16px; }

  /* ---------- design tokens per direction ---------- */
  .app {
    --r-lg: 18px; --r-md: 12px; --r-sm: 8px;
    --font: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --a1: #6d5ae6; --a2: #0f9d8a; --a3: #d97706;
    --ok: #16a34a; --warn: #d97706;
    width: 1440px; height: 860px; overflow: hidden; border-radius: 16px;
    display: grid; grid-template-columns: 268px 1fr 372px;
    font-family: var(--font); color: var(--text); background: var(--app-bg);
    border: 1px solid var(--line); box-shadow: 0 30px 80px -40px rgba(0,0,0,.35);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
  }
  .paper {
    --app-bg: #fbfaf7; --side-bg: #f3f1ec; --surface: #ffffff; --surface-2: #f5f3ee;
    --text: #1d1b18; --text-2: #6e6a62; --text-3: #a29d93; --line: #e8e4db;
    --accent: #e0531f; --accent-ink: #fff; --accent-soft: #fdeee6; --active: #ffffff;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 14px -6px rgba(60,40,20,.10);
  }
  .midnight {
    --app-bg: #0a0c11; --side-bg: rgba(255,255,255,.018); --surface: #12151c; --surface-2: #171b24;
    --text: #e9ebf1; --text-2: #959cab; --text-3: #626a79; --line: rgba(255,255,255,.075);
    --accent: #8b7cff; --accent-ink: #0a0c11; --accent-soft: rgba(139,124,255,.14); --active: rgba(255,255,255,.06);
    --a1: #a78bfa; --a2: #2dd4bf; --a3: #fbbf24; --ok: #4ade80; --warn: #fbbf24;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.6);
    background:
      radial-gradient(700px 380px at 78% -8%, rgba(124,92,255,.20), transparent 70%),
      radial-gradient(520px 340px at 8% 108%, rgba(34,211,238,.12), transparent 70%),
      #0a0c11;
  }
  .studio {
    --r-lg: 10px; --r-md: 8px; --r-sm: 6px;
    --app-bg: #ffffff; --side-bg: #fafafa; --surface: #ffffff; --surface-2: #f4f4f4;
    --text: #0a0a0a; --text-2: #5c5c5c; --text-3: #9a9a9a; --line: #ebebeb;
    --accent: #0a0a0a; --accent-ink: #d4ff3a; --accent-soft: #f0ffd0; --active: #efefef;
    --a1: #0a0a0a; --a2: #0a0a0a; --a3: #0a0a0a;
    --shadow: 0 0 0 1px #ebebeb;
  }

  /* ---------- sidebar ---------- */
  .side { background: var(--side-bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; gap: 12px; min-height: 0; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 6px 6px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklab, var(--accent) 55%, #000)); }
  .midnight .logo { background: linear-gradient(135deg, #8b5cf6, #22d3ee); }
  .studio .logo { background: #0a0a0a; color: #d4ff3a; border-radius: 6px; }
  .ws b { display: block; font-size: 14px; }
  .ws small { display: block; color: var(--text-3); font-size: 11.5px; }
  .ws svg { margin-left: auto; color: var(--text-3); }
  .search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--r-md); color: var(--text-3); font-size: 13px;
    background: var(--surface); border: 1px solid var(--line); }
  .midnight .search { background: rgba(255,255,255,.035); }
  .search kbd { margin-left: auto; font: 500 11px var(--mono); padding: 2px 5px; border-radius: 5px; border: 1px solid var(--line); color: var(--text-3); }
  nav { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
  .sec { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; padding: 12px 8px 6px; }
  .studio .sec { font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
  .item { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 8px; border-radius: var(--r-sm); font-size: 13.5px; color: var(--text-2); }
  .item.active { background: var(--active); color: var(--text); box-shadow: var(--shadow); font-weight: 550; }
  .studio .item.active { box-shadow: none; }
  .item .meta { margin-left: auto; font-size: 11px; color: var(--text-3); }
  .hash { width: 22px; text-align: center; color: var(--text-3); font-weight: 500; }
  .badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 650; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); }
  .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 4px; border-top: 1px solid var(--line); }
  .me b { display: block; font-size: 13px; }
  .me small { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-3); }
  .me small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .me svg { margin-left: auto; color: var(--text-3); }

  /* ---------- avatars ---------- */
  .av { position: relative; flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; }
  .av.lg { width: 34px; height: 34px; border-radius: 11px; font-size: 13px; }
  .av.md { width: 28px; height: 28px; border-radius: 9px; font-size: 11.5px; }
  .av.hu { border-radius: 50%; }
  .ag.a1 { background: linear-gradient(140deg, var(--a1), color-mix(in oklab, var(--a1) 60%, #000)); }
  .ag.a2 { background: linear-gradient(140deg, var(--a2), color-mix(in oklab, var(--a2) 60%, #000)); }
  .ag.a3 { background: linear-gradient(140deg, var(--a3), color-mix(in oklab, var(--a3) 60%, #000)); }
  .studio .ag { background: #0a0a0a !important; color: #d4ff3a; border-radius: 6px; }
  .hu.h1 { background: linear-gradient(140deg, #f59e0b, #ef4444); }
  .hu.h2 { background: linear-gradient(140deg, #38bdf8, #6366f1); }
  .hu.h3 { background: linear-gradient(140deg, #34d399, #0ea5e9); }
  .pres { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px var(--side-bg); }
  .paper .pres { box-shadow: 0 0 0 2px #f3f1ec; } .midnight .pres { box-shadow: 0 0 0 2px #0e1016; } .studio .pres { box-shadow: 0 0 0 2px #fafafa; }
  .av.live::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; padding: 1.5px;
    background: conic-gradient(from var(--spin, 0deg), var(--a2), transparent 60%, var(--a2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 1.4s linear infinite; }
  @property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --spin: 360deg; } }
  .typing { margin-left: auto; display: flex; gap: 3px; }
  .typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--a2); animation: bob 1.1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

  /* ---------- main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .top { height: 60px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .top .t { display: flex; align-items: center; gap: 6px; font-size: 15.5px; font-weight: 650; white-space: nowrap; }
  .top .t .hash { width: auto; }
  .lock { color: var(--text-3); display: inline-flex; }
  .topic { font-size: 12.5px; color: var(--text-3); padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .stack { display: flex; } .stack .av { width: 24px; height: 24px; font-size: 9.5px; box-shadow: 0 0 0 2px var(--app-bg); margin-left: -6px; }
  .midnight .stack .av { box-shadow: 0 0 0 2px #0d0f15; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 550; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .studio .chip { border-radius: 6px; font-family: var(--mono); font-weight: 500; font-size: 11.5px; }
  .ib { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2); }
  .ib.on { background: var(--accent-soft); color: var(--accent); }
  .midnight .ib.on { color: #b9adff; }
  .studio .ib.on { background: #0a0a0a; color: #d4ff3a; }

  .tl { flex: 1; overflow: hidden; padding: 18px 32px 150px; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; }
  .tl > * { flex: none; }
  .day { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .msg { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .hd b { font-size: 14px; font-weight: 650; }
  .hd time { font-size: 11.5px; color: var(--text-3); }
  .model { font: 500 11px var(--mono); color: var(--text-2); padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
  .body { font-size: 14.5px; line-height: 1.62; color: var(--text); }
  .body p { margin: 0 0 8px; } .body p:last-child { margin-bottom: 0; }
  .mention { color: var(--accent); font-weight: 600; background: var(--accent-soft); padding: 1px 5px; border-radius: 6px; }
  .midnight .mention { color: #c4baff; }
  .studio .mention { color: #0a0a0a; background: #d4ff3a; }
  .agentcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow); }
  .midnight .agentcard { background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015)); }
  .studio .agentcard { box-shadow: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tool { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 8px; border-radius: 8px; font: 500 12px var(--mono);
    color: var(--text-2); background: var(--surface-2); border: 1px solid var(--line); }
  .tool .n { color: var(--text-3); }
  .tool .ok { color: var(--ok); display: inline-flex; }
  .tool .dur { color: var(--text-3); font-size: 11px; }
  .tool.run { color: var(--text); border-color: color-mix(in oklab, var(--a2) 45%, var(--line)); background: color-mix(in oklab, var(--a2) 9%, var(--surface)); }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--a2) 30%, transparent); border-top-color: var(--a2); animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .body h4 { margin: 4px 0 6px; font-size: 14.5px; font-weight: 650; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 8px 0 10px; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--text-2); background: var(--surface-2); font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-size: 12.5px; }
  .up { color: var(--ok); font-weight: 600; }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .react { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 12px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); }
  .react.mine { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); background: var(--accent-soft); color: var(--text); }
  .studio .react.mine { background: #f0ffd0; border-color: #0a0a0a; }
  .thr { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 7px 10px 7px 8px; border-radius: 12px; width: fit-content; border: 1px solid var(--line); background: var(--surface); }
  .thr .stack .av { width: 20px; height: 20px; font-size: 8.5px; box-shadow: 0 0 0 2px var(--surface); }
  .thr b { font-size: 12.5px; color: var(--accent); }
  .midnight .thr b { color: #b9adff; } .studio .thr b { color: #0a0a0a; text-decoration: underline; text-underline-offset: 3px; }
  .thr span { font-size: 12px; color: var(--text-3); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--a2); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--a2); box-shadow: 0 0 0 0 var(--a2); animation: pulse 1.6s infinite; }
  .studio .status { color: #0a0a0a; font-family: var(--mono); background: #d4ff3a; padding: 1px 7px; border-radius: 4px; }
  .studio .status::before { background: #0a0a0a; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--a2) 60%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .stop { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 8px; font-size: 12px; color: var(--text-2); border: 1px solid var(--line); background: var(--surface); }
  .stop i { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  .caret { display: inline-block; width: 8px; height: 16px; margin-left: 2px; vertical-align: -3px; border-radius: 2px; background: var(--a2); animation: blink 1s steps(2) infinite; }
  .studio .caret { background: #0a0a0a; }
  @keyframes blink { 50% { opacity: 0; } }
  .streaming .agentcard { border-color: color-mix(in oklab, var(--a2) 35%, var(--line)); }
  .midnight .streaming .agentcard { box-shadow: 0 0 0 1px rgba(45,212,191,.15), 0 0 40px -10px rgba(45,212,191,.35); }

  /* ---------- composer ---------- */
  .composer { position: absolute; left: 24px; right: 24px; bottom: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 12px 40px -18px rgba(0,0,0,.28), var(--shadow); padding: 12px 12px 10px 16px; }
  .midnight .composer { background: rgba(23,27,36,.72); backdrop-filter: blur(16px); }
  .studio .composer { border-radius: 10px; box-shadow: 0 0 0 1px #0a0a0a; border-color: #0a0a0a; }
  .ph { font-size: 14.5px; color: var(--text-3); padding: 2px 0 12px; }
  .bar { display: flex; align-items: center; gap: 4px; }
  .bar .ib { width: 30px; height: 30px; }
  .bar .chip { margin-left: 6px; }
  .send { margin-left: auto; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
  .midnight .send { background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: #fff; }
  .hint { font-size: 11.5px; color: var(--text-3); margin-left: 8px; }
  .hint kbd { font: 500 10.5px var(--mono); padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; }

  /* ---------- thread panel ---------- */
  .thread { border-left: 1px solid var(--line); background: var(--side-bg); display: flex; flex-direction: column; min-height: 0; position: relative; }
  .paper .thread { background: #f8f6f2; }
  .th-top { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .th-top small { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); }
  .th-top small svg { margin-left: auto; }
  .th-top h3 { margin: 6px 0 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .th-top p { margin: 3px 0 0; font-size: 12px; color: var(--text-3); }
  .th-body { flex: 1; overflow: hidden; padding: 16px 18px 120px; display: flex; flex-direction: column; gap: 14px; }
  .th-body .msg { grid-template-columns: 28px 1fr; gap: 10px; }
  .th-body .body { font-size: 13.5px; }
  .th-body .hd b { font-size: 13px; }
  .replies { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
  .replies::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .approve { border-radius: var(--r-lg); padding: 12px 14px; background: var(--surface); border: 1px solid color-mix(in oklab, var(--warn) 45%, var(--line)); box-shadow: var(--shadow); }
  .midnight .approve { background: rgba(251,191,36,.05); }
  .studio .approve { border: 1px solid #0a0a0a; box-shadow: 4px 4px 0 #d4ff3a; }
  .approve .ah { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 650; color: var(--warn); margin-bottom: 6px; }
  .studio .approve .ah { color: #0a0a0a; font-family: var(--mono); }
  .approve p { margin: 0 0 8px; font-size: 13px; }
  .approve code, .body code { font: 500 12px var(--mono); padding: 1px 5px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); }
  pre { margin: 0 0 10px; padding: 9px 11px; border-radius: 10px; font: 500 11.5px/1.5 var(--mono); background: var(--surface-2); border: 1px solid var(--line); color: var(--text); white-space: pre-wrap; }
  .midnight pre { background: rgba(0,0,0,.35); }
  .studio pre { background: #0a0a0a; color: #d4ff3a; border-color: #0a0a0a; }
  .btns { display: flex; gap: 8px; }
  .btn { height: 30px; padding: 0 14px; border-radius: 9px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .btn.pri { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .midnight .btn.pri { background: linear-gradient(135deg, #8b5cf6, #22d3ee); color: #fff; }
  .btn .k { font: 500 10.5px var(--mono); opacity: .7; }
  .th-comp { position: absolute; left: 14px; right: 14px; bottom: 14px; border-radius: 14px; padding: 10px 10px 10px 14px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 13px; color: var(--text-3); }
  .studio .th-comp { border-radius: 8px; }
  .th-comp .send { width: 30px; height: 30px; border-radius: 9px; }
  svg { flex: none; }
</style>
</head>
<body>
<div class="page">
  <div class="tabs" id="tabs"></div>
  <section><div class="label" id="ov-label"></div><div class="stage" id="overview"></div></section>
  <section><div class="label">Close-up<small>timeline and composer at reading size</small></div><div class="crop" id="crop"></div></section>
</div>

<template id="app">
<div class="app">
  <aside class="side">
    <div class="ws">
      <div class="logo">A</div>
      <div><b>Acme</b><small>mindroom.acme.com</small></div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

<script>
  const directions = {
    paper: ["A · Paper", "warm light, editorial, ember accent"],
    midnight: ["B · Midnight", "dark, aurora glow, glass composer"],
    studio: ["C · Studio", "monochrome, sharp, lime highlights"],
  };
  const tpl = document.getElementById("app");
  const W = 1440, H = 860, SIDE = 268, MAIN = 800;
  let current = "paper";
  function clone(cls) { const a = tpl.content.firstElementChild.cloneNode(true); a.classList.add(cls); return a; }
  function render() {
    const [name, desc] = directions[current];
    document.getElementById("ov-label").innerHTML = `${name}<small>${desc}</small>`;
    const ov = document.getElementById("overview"); ov.replaceChildren(clone(current));
    ov.firstElementChild.style.zoom = Math.min(1, ov.clientWidth / W);
    const crop = document.getElementById("crop"); const c = clone(current); crop.replaceChildren(c);
    const CROP_ZOOM = Math.min(1.1, crop.clientWidth / MAIN);
    c.style.zoom = CROP_ZOOM;
    c.style.marginLeft = `-${SIDE}px`;
    c.style.marginTop = `-${H - crop.clientHeight / CROP_ZOOM}px`;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.dir === current)));
  }
  const tabs = document.getElementById("tabs");
  for (const [dir, [name]] of Object.entries(directions)) {
    const b = document.createElement("button"); b.textContent = name; b.dataset.dir = dir;
    b.onclick = () => { current = dir; render(); }; tabs.appendChild(b);
  }
  render();
  addEventListener("resize", render);
</script>
