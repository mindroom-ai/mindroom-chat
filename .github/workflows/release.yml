# Automatic releases. After CI passes for a push to main, tags that commit with the next calendar
# version (vYYYY.M.N) and publishes its GitHub release, with notes from the commits since the last
# release, when package.json says "autoRelease": true. With false the job still runs, logs
# that automatic releases are off and stops. scripts/calver.mjs does the work; docs/ios-release.md
# describes the scheme and how Xcode Cloud builds the tags. A new release then gets its container
# image (image.yml).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time, never cancelled halfway; a waiting run gives way to a newer one, whose
# release holds its commits too.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag the next calendar version
    # Only pushes to main whose CI passed; a run CI cancelled for a newer push releases nothing.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      # The tag of the release this run cut, empty when it cut none.
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Every tag and the history since the last release: the version and the notes.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Release the commit if package.json allows it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/calver.mjs auto "$HEAD_SHA" --main origin/main

  image:
    name: Publish the image
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
