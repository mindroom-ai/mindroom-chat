name: Create MindRoom Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: auto-mindroom-release-dev
  cancel-in-progress: false

jobs:
  release:
    name: Create release tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Refresh remote tags
        run: git fetch --force --tags origin
      - name: Compute MindRoom release tag
        id: version
        env:
          RELEASE_TAG_PREFIX: v
          RELEASE_TAG_SUFFIX: mindroom
        run: python3 scripts/fork_release_tag.py
      - name: Create release (or skip if it already exists)
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          RELEASE_ITERATION: ${{ steps.version.outputs.release_iteration }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "Automated release based on Cinny ${BASE_VERSION} (MindRoom iteration ${RELEASE_ITERATION})."
