name: Create MindRoom Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild the Mac DMG, e.g. v4.12.6-mindroom.523'
        required: true
        type: string
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: auto-mindroom-release-dev
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' }}
    name: Create release tag and GitHub release
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_iteration: ${{ steps.version.outputs.release_iteration }}
      release_created: ${{ steps.create_release.outputs.created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Refresh remote tags
        run: git fetch --force --tags origin
      - name: Compute MindRoom release tag
        id: version
        env:
          RELEASE_TAG_PREFIX: v
          RELEASE_TAG_SUFFIX: mindroom
        run: python3 scripts/fork_release_tag.py
      - name: Create release (or skip if it already exists)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          RELEASE_ITERATION: ${{ steps.version.outputs.release_iteration }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "Automated release based on Cinny ${BASE_VERSION} (MindRoom iteration ${RELEASE_ITERATION})."
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-android-internal:
    name: Publish Android internal testing release
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3

      - name: Configure Android upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail

          missing=0
          for secret_name in \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
          do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub secret: ${secret_name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/mindroom-upload-keystore.jks"
          test -s "$HOME/.android/mindroom-upload-keystore.jks"
          chmod 600 "$HOME/.android/mindroom-upload-keystore.jks"

          cat > "$HOME/.android/mindroom-upload-keystore.properties" <<EOF
          storeFile=$HOME/.android/mindroom-upload-keystore.jks
          storePassword=$ANDROID_UPLOAD_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_UPLOAD_KEY_ALIAS
          keyPassword=$ANDROID_UPLOAD_KEY_PASSWORD
          EOF

      - name: Install JS deps
        run: npm ci

      - name: Build web bundle
        env:
          MINDROOM_RELEASE_VERSION: ${{ needs.release.outputs.release_tag }}
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Compute Android release metadata
        id: android_version
        env:
          BASE_VERSION: ${{ needs.release.outputs.base_version }}
          RELEASE_ITERATION: ${{ needs.release.outputs.release_iteration }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          base_version = os.environ["BASE_VERSION"]
          release_iteration = os.environ["RELEASE_ITERATION"]

          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", base_version)
          if not match:
              raise SystemExit(f"Unsupported MindRoom base version: {base_version}")
          if not release_iteration.isdigit():
              raise SystemExit(f"Unsupported MindRoom release iteration: {release_iteration}")

          major, minor, patch = (int(value) for value in match.groups())
          iteration = int(release_iteration)
          version_code = major * 1_000_000 + minor * 10_000 + patch * 100 + iteration
          print(f"version_code={version_code}")
          print(f"version_name={base_version}")
          PY

      - name: Build signed release AAB
        working-directory: android
        env:
          MINDROOM_ANDROID_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          MINDROOM_ANDROID_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Verify release AAB signature
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Create Play release notes
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          mkdir -p distribution/whatsnew
          printf 'MindRoom Android update %s.\n' "$RELEASE_TAG" > distribution/whatsnew/whatsnew-en-US

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mindroom-android-release-aab-${{ needs.release.outputs.release_tag }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mindroom_ai.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ needs.release.outputs.release_tag }}
          whatsNewDirectory: distribution/whatsnew

  macos_app:
    name: Publish notarized Mac Catalyst DMG
    needs: release
    # Recovery dispatches skip release creation and Android publishing.
    if: ${{ always() && !cancelled() && (needs.release.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || needs.release.outputs.release_tag }}
    steps:
      - name: Resolve existing release and version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-mindroom\.([0-9]+)$ ]]; then
            echo 'Expected release tag v<major>.<minor>.<patch>-mindroom.<iteration>.' >&2
            exit 1
          fi
          echo "base_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "release_iteration=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
      - name: Checkout release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install JS deps
        run: npm ci
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      - name: Resolve Developer ID identity
        id: codesign
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning |
            awk -F '"' '/Developer ID Application:.*\(DNA6966LGZ\)/ { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo 'Developer ID Application signing identity for DNA6966LGZ not found.' >&2
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Decode Mac Catalyst provisioning profile
        id: profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MACOS_PROVISIONING_PROFILE_BASE64"
          umask 077
          profile_dir=$(mktemp -d "$RUNNER_TEMP/mindroom-chat-signing.XXXXXX")
          echo "directory=$profile_dir" >> "$GITHUB_OUTPUT"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_dir/profile.provisionprofile"
          test -s "$profile_dir/profile.provisionprofile"
      - name: Build signed and notarized DMG
        env:
          CODESIGN_IDENTITY: ${{ steps.codesign.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE_PATH: ${{ steps.profile.outputs.directory }}/profile.provisionprofile
          MARKETING_VERSION: ${{ steps.version.outputs.base_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.release_iteration }}
          MINDROOM_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: scripts/build-macos-app.sh --sign
      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/macos/MindRoom-Chat.dmg --repo "$GITHUB_REPOSITORY" --clobber
      - name: Mint Homebrew tap token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: mindroom-ai
          repositories: homebrew-tap
      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          gh api repos/mindroom-ai/homebrew-tap/dispatches \
            -f event_type=mindroom-chat-release \
            -f "client_payload[tag_name]=$RELEASE_TAG" \
            -f "client_payload[asset_url]=https://github.com/mindroom-ai/mindroom-chat/releases/download/$RELEASE_TAG/MindRoom-Chat.dmg"
      - name: Remove decoded provisioning profile
        if: ${{ always() && steps.profile.outputs.directory != '' }}
        env:
          PROFILE_DIR: ${{ steps.profile.outputs.directory }}
        run: rm -rf "$PROFILE_DIR"
