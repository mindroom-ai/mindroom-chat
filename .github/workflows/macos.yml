# Pull-request unsigned validation for the remaining Mac Catalyst / Mac App Store targets.
# Release signing and DMG publishing moved to .github/workflows/desktop.yml (Electron Mac app).
# This workflow builds unsigned only and publishes nothing.
name: Mac app

on:
  pull_request:
    paths:
      - ios/**
      - scripts/build-macos-app.sh
      - scripts/macos-dmg/**
      - scripts/build-macos-store.sh
      - scripts/macos-store-preflight.mjs
      - scripts/test-macos-support.sh
      - scripts/fetch-sparkle.sh
      - scripts/macos-updater-info-plist.sh
      - .github/workflows/macos.yml

permissions:
  contents: read

jobs:
  dmg:
    name: Validate Mac Catalyst builds unsigned
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: macos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Check native Mac support
        run: scripts/test-macos-support.sh
      - name: Archive the Mac App Store variant unsigned
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          version=$(node scripts/ios-ci-version.mjs | sed -n 's/^marketing_version=//p')
          MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            scripts/build-macos-store.sh --unsigned
      - name: Build unsigned
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: scripts/build-macos-app.sh
