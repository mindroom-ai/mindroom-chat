name: Build macOS app

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'patches/@capacitor+*.patch'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'scripts/build-macos-app.sh'
      - '.github/workflows/build-macos-pr.yml'

permissions:
  contents: read

concurrency:
  group: build-macos-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mac Catalyst app (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # npm ci runs dependency scripts; keep the token out of .git/config.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Build unsigned Mac Catalyst archive
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: scripts/build-macos-app.sh
