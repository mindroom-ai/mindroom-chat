# Every push to main and every pull request: the type check, the strict check, ESLint and
# the unit suite in one job, and in another the production build, its bundle size budget and a smoke
# subset of the end-to-end specs against a disposable Tuwunel homeserver.
name: CI

on:
  push:
    branches: [main]
    # Screenshots and the session log change nothing these jobs check.
    paths-ignore:
      - 'docs/design/**'
      - 'docs/provenance.md'
  pull_request:
    paths-ignore:
      - 'docs/design/**'
      - 'docs/provenance.md'

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # node_modules as `npm ci` leaves it, patches applied; a new lockfile or patch makes a new key.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'patches/**') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Each check runs even when one before it failed, so one run reports all of them.
      # The app sources alone (config/tsconfig.app.json: src without tests), as the build ships them.
      # The strict check below covers these files too, but with the tests and e2e/ in the same program;
      # this step fails on app code that compiles only with a declaration a test or spec adds (a
      # `declare global` or a module augmentation).
      - name: Type check
        run: npx tsc --noEmit -p config/tsconfig.app.json
      - name: Strict check
        if: ${{ !cancelled() }}
        # config/tsconfig.strict.json covers the tests too; tsc needs more than Node's default heap on a runner.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc --noEmit -p config/tsconfig.strict.json
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run

  e2e:
    name: End-to-end smoke specs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'patches/**') }}
      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # The `just hs-up` homeserver on 127.0.0.1:28008, the Tuwunel image e2e/docker-compose.yaml pins;
      # e2e/global-setup.ts registers the accounts.
      - name: Start the test homeserver
        run: docker compose -f e2e/docker-compose.yaml up -d --wait
      # Playwright's own Chromium: no CHROMIUM_PATH is set here, so the config falls back to it.
      # The runner image already has the libraries Chromium needs; `--with-deps` only added fonts the
      # smoke specs do not look at (no screenshots), and its apt step fails whenever the Ubuntu archive
      # mirrors cannot be reached.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Build
        id: build
        run: npx vite build
      # What a first visit downloads before the app runs must stay within scripts/perf/bundle-budget.json,
      # as scripts/push-gate.sh checks it.
      - name: Bundle size budget
        run: node scripts/perf/bundle-report.mjs dist --budget scripts/perf/bundle-budget.json
      # The production build through `vite preview`, as `scripts/e2e-slot.sh --preview` serves it.
      # Playwright retries a failed test once on CI (playwright.config.ts). The specs share one
      # homeserver and run in path order, so none of them looks for its room in a long room list.
      # They run whenever the build succeeded, so a failed bundle size budget alone still reports them.
      - name: Smoke specs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          E2E_SERVER_COMMAND: npx vite preview --host 127.0.0.1 --port 4200 --strictPort
          E2E_REUSE_EXISTING_SERVER: '0'
        run: >-
          npx playwright test
          e2e/sidebar/room-unread-filter.spec.ts
          e2e/command-palette/command-palette.live.spec.ts
          e2e/threads/compact-card-display-names.live.spec.ts
          e2e/account/login.live.spec.ts
          e2e/composer/long-composer-message.live.spec.ts
          e2e/room/rooms.live.spec.ts
          e2e/shell/smoke.live.spec.ts
          e2e/threads/threads.live.spec.ts
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
