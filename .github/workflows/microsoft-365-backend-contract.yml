name: Microsoft 365 backend contract

on:
  pull_request:
    paths:
      - '.github/workflows/microsoft-365-backend-contract.yml'
      - 'src/app/mindroom/documents/__fixtures__/microsoft365BackendContract.json'
      - 'src/app/mindroom/documents/microsoft365BackendContract.test.ts'
      - 'src/app/mindroom/documents/documentProtocol.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contract:
    name: Verify backend wire contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MindRoom Chat
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout pinned MindRoom backend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: mindroom-ai/mindroom
          ref: 8c5c1f134721137cc1e77517cabbcc008f780deb
          path: mindroom-contract
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install backend test dependencies
        working-directory: mindroom-contract
        run: uv sync --locked --group dev
      - name: Generate contract from real backend tools
        working-directory: mindroom-contract
        run: >-
          uv run --locked --group dev -m tests.microsoft_365_contract_fixture
          --output "$GITHUB_WORKSPACE/generated-microsoft-365-contract.json"
      - name: Compare generated contract with committed fixture
        run: |
          fixture=src/app/mindroom/documents/__fixtures__/microsoft365BackendContract.json
          if ! cmp --silent "$fixture" generated-microsoft-365-contract.json; then
            diff --unified "$fixture" generated-microsoft-365-contract.json
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install client dependencies
        run: npm ci
      - name: Parse generated backend events in the real client parser
        env:
          MICROSOFT_365_CONTRACT_FIXTURE: ${{ github.workspace }}/generated-microsoft-365-contract.json
        run: npx vitest run src/app/mindroom/documents/microsoft365BackendContract.test.ts
