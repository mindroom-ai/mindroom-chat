name: iOS routing

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'patches/@capacitor+ios+*.patch'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/*ios-routing*'
      - 'src/app/pages/paths.ts'
      - 'src/app/pages/Router.tsx'
      - '.github/workflows/ios-routing.yml'

permissions:
  contents: read

jobs:
  routing:
    name: Native room reload and WebContent recovery
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app
      - name: Install test project generator
        run: gem install --user-install --no-document xcodeproj -v 1.27.0
      - name: Run native routing tests
        run: bash scripts/test-ios-routing.sh
      - name: Upload native results and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-routing-results
          path: |
            .claude/evidence/ios-routing/*.xcresult
            .claude/evidence/ios-routing/xcodebuild.log
          include-hidden-files: true
          retention-days: 14
